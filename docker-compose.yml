# DevBox runtime for SquirrelMail
# Port block: block-app-20100
# App binds to 127.0.0.1:20100
# Internal services (IMAP, SMTP) are private to the Docker network.
# Do not expose database, cache, IMAP, or SMTP ports to the host.

services:
  web:
    image: php:8.3-apache
    container_name: squirrelmail-web
    ports:
      - "127.0.0.1:20100:80"
    volumes:
      - .:/var/www/html:rw
      - squirrelmail_data:/var/local/squirrelmail/data
      - squirrelmail_attach:/var/local/squirrelmail/attach
      - ./docker/devbox.config.php:/var/www/html/config/config.php:ro
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      imap:
        condition: service_started
      smtp:
        condition: service_started
    networks:
      - devbox-net
    restart: unless-stopped

  imap:
    image: dovecot/dovecot:2.3.21
    container_name: squirrelmail-imap
    volumes:
      - ./docker/dovecot:/etc/dovecot:ro
      - squirrelmail_mail:/srv/mail
    networks:
      - devbox-net
    restart: unless-stopped

  smtp:
    image: axllent/mailpit:latest
    container_name: squirrelmail-smtp
    networks:
      - devbox-net
    restart: unless-stopped

volumes:
  squirrelmail_data:
  squirrelmail_attach:
  squirrelmail_mail:

networks:
  devbox-net:
    driver: bridge
