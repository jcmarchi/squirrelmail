foundation_applicability_version: "2.0"
project_type: "legacy-webapp"
stage: "legacy-modernization"
target_level: "spine"

instructions: >
  This file is project-specific. Do not copy values blindly from another project.
  Populate it by applying .qli/binding/foundation-applicability-rules.yml to the project profile.

allowed_values:
  - required
  - spine_required
  - minimum_required
  - partial
  - deferred
  - not_applicable
  - blocked

foundations:
  acd:
    applicability: spine_required
    reason: "All Buildline projects require construction doctrine."
  uiux:
    applicability: deferred
    reason: "Frameset-based UI. Defer modernization until after Spine."
  data:
    applicability: minimum_required
    reason: "File-based preferences, address books, attachments, DevBox data volumes, and config-driven storage paths must be mapped now. Database migration remains deferred."
  api:
    applicability: not_applicable
    reason: "No API surface. Internal PHP application with direct IMAP/SMTP communication."
  acl:
    applicability: minimum_required
    reason: "Anonymous login surfaces, authenticated mailbox routes, admin/configtest surfaces, plugin surfaces, session/referrer protections, and access-sensitive file/attachment behavior must be mapped now. New ACL implementation remains deferred."
  security:
    applicability: minimum_required
    reason: "Production security posture required per operating profile."
  testing:
    applicability: minimum_required
    reason: "No automated tests exist. Smoke and characterization tests needed before any modernization."
  runtime:
    applicability: required
    reason: "DevBox runtime baseline established (PR #1). PHP 8.3 Apache + Dovecot + Mailpit."
  observability:
    applicability: deferred
    reason: "Baseline observability. Defer structured logging/monitoring until after Spine."
  delivery:
    applicability: required
    reason: "Docker Compose delivery via DevBox. Start/stop/smoke documented in DEVBOX.md."
  devbox:
    applicability: required
    reason: "Project runs inside QLi DevBox. DevBox integration is required."
