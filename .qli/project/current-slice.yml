slice_id: "adoption-intake-001"
title: "SquirrelMail QLi Buildline Adoption Intake"
mode: "foundation-spine"
objective: "Perform read-only discovery of the SquirrelMail codebase and populate Buildline adoption files: adoption-intake.md, behavior-snapshot.md, risk-map.md. Update foundation applicability and status based on discovery evidence."
approved_scope:
  include:
    - ".qli/project/adoption-intake.md"
    - ".qli/project/behavior-snapshot.md"
    - ".qli/project/risk-map.md"
    - ".qli/project/foundation-applicability.yml"
    - ".qli/project/foundation-status.yml"
    - ".qli/project/evidence-log.md"
    - ".qli/project/current-slice.yml"
    - ".qli/project/context-packet.yml"
  exclude:
    - "src/**"
    - "functions/**"
    - "class/**"
    - "plugins/**"
    - "themes/**"
    - "config/**"
    - "include/**"
    - "docker/**"
    - "docker-compose.yml"
    - "DEVBOX.md"
    - "devbox-setup.sh"
triggered_foundations:
  - acd
expected_evidence:
  core: "Architecture discovery complete. Entry points, initialization, auth, IMAP, SMTP, MIME, preferences, plugins, templates, i18n documented."
  ui: "Behavior snapshot documents all user-facing flows."
  tests: "n/a — read-only discovery pass"
  docs: "adoption-intake.md, behavior-snapshot.md, risk-map.md created."
risk_level: "low"
validation_tier: "tier1-static"
