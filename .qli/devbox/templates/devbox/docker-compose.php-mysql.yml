services:
  app:
    build:
      context: .
      dockerfile: infra/docker/devbox/php-apache.Dockerfile
      args:
        DEVBOX_UID: "${DEVBOX_UID:-1000}"
        DEVBOX_GID: "${DEVBOX_GID:-1000}"
    container_name: <SLUG>-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:<APP_PORT>:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: <SLUG>-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
    volumes:
      - <SLUG>_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  <SLUG>_mysql_data:
