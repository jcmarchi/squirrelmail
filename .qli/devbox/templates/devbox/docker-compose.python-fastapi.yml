services:
  api:
    build:
      context: .
      dockerfile: infra/docker/devbox/python-fastapi.Dockerfile
      args:
        DEVBOX_UID: "${DEVBOX_UID:-1000}"
        DEVBOX_GID: "${DEVBOX_GID:-1000}"
    container_name: <SLUG>-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:<APP_PORT>:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: <SLUG>-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - <SLUG>_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  <SLUG>_postgres_data:
