# Dovecot configuration for DevBox test IMAP
# Provides a local-only IMAP server with static test users.
# Not for production use.

# 2.3.21
auth_mechanisms = plain login
disable_plaintext_auth = no
mail_location = maildir:/srv/mail/%u
mail_privileged_group = dovecot
mail_access_groups = dovecot
first_valid_uid = 101
last_valid_uid = 101
auth_debug = yes
auth_verbose = yes
mail_debug = yes
log_path = /dev/stderr
info_log_path = /dev/stderr

namespace inbox {
  inbox = yes
  separator = /
}

protocols = imap
listen = *

service imap-login {
  inet_listener imap {
    port = 143
  }
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/users.passwd
}

userdb {
  driver = static
  args = uid=dovecot gid=dovecot home=/srv/mail/%u
}

ssl = no
